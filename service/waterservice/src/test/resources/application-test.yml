server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:waterservice-test;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: water-test-hikari
      maximum-pool-size: 2
      minimum-idle: 1
      connection-timeout: 5000
      validation-timeout: 1000

water:
  worker:
    enabled: false
    cron: "0 0 0 1 1 *"
    pause-between-stations-ms: 0
    connect-timeout-ms: 1000
    read-timeout-ms: 1000
    user-agent: "water-station-pusher-test/1.0.0"

management:
  health:
    db:
      enabled: false

logging:
  level:
    root: WARN
    com.fishfind.water: WARN
