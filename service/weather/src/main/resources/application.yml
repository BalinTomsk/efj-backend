spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mail:
    # All blank/empty by default: SMTP is optional. If unset, the app still starts and runs
    # the weather worker normally; only the weekly report email is silently skipped
    # (see WeeklyReportMailService).
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  # Single listener: the app has no controllers, so the main server carries only
  # the actuator endpoints. No second (management) port, nothing on 8080.
  port: 8081
  shutdown: graceful

resilience4j:
  retry:
    instances:
      sqlRetry:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - org.springframework.dao.DataAccessException
          - java.sql.SQLException
      openMeteo:
        max-attempts: 4
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - java.io.IOException
        ignore-exceptions:
          - java.io.FileNotFoundException
          - com.fishfind.weather.service.RateLimitedException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      weatherGov:
        max-attempts: 4
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - java.io.IOException
        ignore-exceptions:
          - java.io.FileNotFoundException
          - com.fishfind.weather.service.RateLimitedException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      visualCrossing:
        max-attempts: 4
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - java.io.IOException
        ignore-exceptions:
          - java.io.FileNotFoundException
          - com.fishfind.weather.service.RateLimitedException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      googleWeather:
        max-attempts: 4
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - java.io.IOException
        ignore-exceptions:
          - java.io.FileNotFoundException
          - com.fishfind.weather.service.RateLimitedException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      weatherCanada:
        max-attempts: 4
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - java.io.IOException
        ignore-exceptions:
          - java.io.FileNotFoundException
          - com.fishfind.weather.service.RateLimitedException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException

  circuitbreaker:
    instances:
      sqlBreaker:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      openMeteo:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - java.io.IOException
        ignore-exceptions:
          - java.io.FileNotFoundException
      weatherGov:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - java.io.IOException
        ignore-exceptions:
          - java.io.FileNotFoundException
      visualCrossing:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - java.io.IOException
        ignore-exceptions:
          - java.io.FileNotFoundException
      googleWeather:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - java.io.IOException
        ignore-exceptions:
          - java.io.FileNotFoundException
      weatherCanada:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - java.io.IOException
        ignore-exceptions:
          - java.io.FileNotFoundException

  ratelimiter:
    instances:
      openMeteo:
        limit-for-period: 5
        limit-refresh-period: 1s
        timeout-duration: 10s
      weatherGov:
        limit-for-period: 1
        limit-refresh-period: 1s
        timeout-duration: 10s
      visualCrossing:
        limit-for-period: 1
        limit-refresh-period: 1s
        timeout-duration: 10s
      googleWeather:
        limit-for-period: 1
        limit-refresh-period: 1s
        timeout-duration: 10s
      weatherCanada:
        limit-for-period: 1
        limit-refresh-period: 5s
        timeout-duration: 10s

weather:
  worker:
    connect-timeout-ms: 15000
    read-timeout-ms: 30000
    open-meteo-base-url: https://api.open-meteo.com/v1/forecast
    weather-gov-base-url: https://api.weather.gov
    weather-gov-user-agent: ${WEATHER_GOV_USER_AGENT:efj-backend-weather/1.0 (ops@fishfind.com)}
    weather-canada-base-url: https://api.weather.gc.ca
    weather-canada-user-agent: ${WEATHER_CANADA_USER_AGENT:efj-backend-weather/1.0 (ops@fishfind.com)}
    weather-canada-bbox-radius-degrees: ${WEATHER_CANADA_BBOX_RADIUS_DEGREES:0.5}
    visual-crossing-base-url: https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/timeline
    visual-crossing-api-key: ${VISUAL_CROSSING_API_KEY:}
    google-weather-base-url: https://weather.googleapis.com/v1/currentConditions:lookup
    google-weather-api-key: ${GOOGLE_WEATHER_API_KEY:}
    enable:
      # false stops that worker from starting at all; omitted means true, so a provider is opted
      # OUT explicitly and adding a new one never requires touching every deployment env file.
      weather-gov: ${WEATHER_GOV_ENABLE:true}
      open-meteo: ${OPEN_METEO_ENABLE:true}
      visual-crossing: ${VISUAL_CROSSING_ENABLE:true}
      google-weather: ${GOOGLE_WEATHER_ENABLE:true}
      weather-canada: ${WEATHER_CANADA_ENABLE:true}
    timeout:
      # Seconds between calls to that provider. 0 or absent = derive it, by spreading that
      # provider daily-limit evenly over 12 hours. An explicit value is used verbatim.
      weather-gov: ${WEATHER_GOV_TIMEOUT:0}
      open-meteo: ${OPEN_METEO_TIMEOUT:0}
      visual-crossing: ${VISUAL_CROSSING_TIMEOUT:0}
      google-weather: ${GOOGLE_WEATHER_TIMEOUT:0}
      weather-canada: ${WEATHER_CANADA_TIMEOUT:0}
    rate-limit:
      max-retries: 2
      default-wait-ms: 5000
      max-wait-ms: 60000
    daily-limit:
      weather-gov: ${WEATHER_GOV_DAILY_LIMIT:900}
      open-meteo: ${OPEN_METEO_DAILY_LIMIT:1400}
      visual-crossing: ${VISUAL_CROSSING_DAILY_LIMIT:900}
      google-weather: ${GOOGLE_WEATHER_DAILY_LIMIT:161}
      weather-canada: ${WEATHER_CANADA_DAILY_LIMIT:900}
    post-processing:
      max-failure-rate: 0.5
  report:
    to: ${REPORT_EMAIL_TO:}          # recipient; blank = weekly email disabled
    from: ${REPORT_EMAIL_FROM:}      # optional; falls back to spring.mail.username
    cron: "0 0 8 * * FRI"            # every Friday 08:00, server-local time
  lifecycle:
    # Crash/unclean-restart tracking (ServiceLifecycleTracker). Persists only if /app/logs
    # is a mounted volume -- otherwise it still works, just resets on every container restart.
    state-dir: ${WEATHER_STATE_DIR:/app/logs/.lifecycle}
    log-file: logs/weather.log      # must match logback-spring.xml's <file> path

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    com.fishfind.weather: INFO
