server:
  port: 8080

spring:
  # Default backing is in-memory, so the service starts with NO database. Exclude the JDBC/datasource
  # auto-configuration that would otherwise fail fast when DB_URL is not set. The `jdbc` profile
  # (application-jdbc.yml) re-enables it by clearing this exclusion.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration

# Entry bounds for the news caches (NewsCacheProperties). Counts of ENTRIES, not bytes — an entry's
# size varies enormously between these, which is why each is tunable separately rather than sharing
# one bound. The caches themselves only exist under the `jdbc` profile; these values are inert without
# it. 0 makes a cache evict on write and therefore always miss — a way to switch one off with no code
# change. Every value below is the default, repeated here so the knobs are discoverable.
#
# HEAP: `export` and `photo` are the expensive ones — roughly 1–1.5 MB and 0.5 MB per entry measured
# live, so ~25–35 MB and ~13 MB when full. The container sets no -Xmx, so the JVM takes its default
# quarter of container memory. Lower these two first if docapi starts pressuring heap.
docapi:
  cache:
    news:
      document: 25    # GET /news/{id}
      miss: 500       # unknown ids, held for NewsDocumentCache.MISS_TTL_MS (60s)
      list: 100       # GET /news/list, outside the US/CA row buckets
      export: 25      # GET /news/export/{id}   — heaviest
      search: 25      # GET /news/search
      photo: 25       # GET /news/photo/{id}    — second heaviest
    fish: 25          # GET /news/fish/{guid}
    water-body: 25    # GET /news/lake/{guid}

resilience4j:
  retry:
    # Lower order than the circuit breaker so the breaker is the OUTERMOST aspect: an open breaker
    # short-circuits immediately instead of being retried, and all retries of one call count as a single
    # breaker outcome. (Only exercised under the `jdbc` profile.)
    retry-aspect-order: 1
    instances:
      sqlRetry:
        # 3 attempts x 2s waits multiplied every stalled DB call: with the old 30s connect timeout
        # one request could occupy ~94s. Retrying is still worth it - the failure this guards against
        # is an intermittently dropped TCP handshake, which a second attempt genuinely does clear -
        # but the total has to fit inside cproxy's 10s read timeout, or the caller only ever sees an
        # opaque 502. Two attempts and a short wait keep the worst case near 6.5s. See the TIME
        # BUDGET note in application-jdbc.yml before changing either number.
        max-attempts: 2
        wait-duration: 500ms
        # Retry ONLY failures a second attempt could plausibly clear. This was
        # `DataAccessException` + `SQLException`, i.e. the root of Spring's DAO hierarchy — which
        # retries everything, including permanent faults. During the 2026-09-02 incident a
        # BadSqlGrammarException (T-SQL sent to MySQL) was retried twice for nothing; a
        # DataIntegrityViolationException on a write would be retried the same way.
        #
        # The three entries below are NOT redundant — Spring files connection failures under
        # different branches, so listing only the "Transient" one would miss the very case this
        # retry exists for:
        #   Hikari pool timeout      SQLTransientConnectionException    -> TransientDataAccessResourceException  (Transient)
        #   driver connect failure   SQLNonTransientConnectionException -> DataAccessResourceFailureException    (NonTransient!)
        #   connection dropped       SQLRecoverableException            -> RecoverableDataAccessException        (Recoverable)
        # Matching is by assignability, so each entry covers its subclasses.
        retry-exceptions:
          - org.springframework.dao.TransientDataAccessException
          - org.springframework.dao.RecoverableDataAccessException
          - org.springframework.dao.DataAccessResourceFailureException
  circuitbreaker:
    circuit-breaker-aspect-order: 2   # higher order => outermost (wraps Retry)
    instances:
      sqlBreaker:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s

management:
  server:
    # Actuator (metrics/prometheus) on a separate port that must NOT be published/exposed publicly;
    # only /health on 8080 is intended for external probes.
    port: 8082
  endpoints:
    web:
      exposure:
        # Only operational endpoints. Deliberately NOT env/configprops/beans (would leak config/secrets).
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true            # /actuator/health/liveness and /actuator/health/readiness
      show-details: never        # aggregate status only; do not expose component details publicly
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState   # no `db` here — the default profile has no datasource
  health:
    db:
      enabled: false               # no datasource in the default (in-memory) profile

logging:
  level:
    root: INFO
    com.fishfind.docapi: INFO
