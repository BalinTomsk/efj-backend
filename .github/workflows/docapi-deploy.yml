name: docapi

# Test → build image → push to GHCR → (optionally) deploy to the droplet.
# Scoped to the docapi path so the other monorepo services are unaffected.
#
# Deploy model (see service/docapi/docs/do-update.md):
#   - build-and-push runs on GitHub-hosted runners and needs no droplet access.
#   - deploy SSHes into the droplet and runs docker pull/run there. Once the droplet is VPC-only
#     with no public SSH, that SSH must originate INSIDE DigitalOcean. Two supported ways:
#       (a) keep runs-on: ubuntu-latest and hop through a public **bastion** via the DEPLOY_BASTION_*
#           secrets (appleboy proxy_*), targeting the droplet's private IP (e.g. 10.118.0.3); or
#       (b) register a **self-hosted runner inside the VPC** and change the deploy job's runs-on to
#           its label, then leave the DEPLOY_BASTION_* secrets empty (direct private connection).
#     The deploy job is skipped automatically until DEPLOY_HOST is set, so pushing to main just
#     builds+pushes the image until the infra/secrets are ready.
#
# Repository secrets:
#   GHCR_PUSH_TOKEN      PAT (write:packages) used to push the image to GHCR (the docapi package is
#                        user-owned and not connected to this repo, so GITHUB_TOKEN can't push it)
#   DEPLOY_HOST          droplet address to deploy to (private IP once VPC-only; public IP for now)
#   DEPLOY_USER          ssh user (root)
#   DEPLOY_SSH_KEY       private key authorized on the droplet
#   DEPLOY_BASTION_HOST  optional: bastion host for ProxyJump (leave empty for a self-hosted runner)
#   DEPLOY_BASTION_USER  optional: bastion ssh user
#   DEPLOY_BASTION_KEY   optional: bastion private key
#   GHCR_PULL_TOKEN      PAT with read:packages so the droplet can pull the image (or make the
#                        ghcr.io/balintomsk/docapi package public and this can be any valid token)
# The deploy publishes 127.0.0.1:8080 and the droplet's VPC address (eth1):8080, like the live container.

on:
  push:
    branches: [ main ]
    paths:
      - "service/docapi/**"
      - ".github/workflows/docapi-deploy.yml"
  pull_request:
    paths:
      - "service/docapi/**"
      - ".github/workflows/docapi-deploy.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to the droplet after build/push"
        type: boolean
        default: true

env:
  IMAGE: ghcr.io/balintomsk/docapi

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service/docapi
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        run: mvn -B test

  build-and-push:
    needs: test
    # Only build/publish an image for real refs, never for PRs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read    # GHCR push uses the GHCR_PUSH_TOKEN PAT (below), not GITHUB_TOKEN, because the
                        # docapi package is user-owned and not connected to this repo.
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        # The pom version (e.g. 1.35.0) is the tag manual deploys use (efj-backend/secret/deploy-docapi-<v>.ps1), so CI
        # pushes it too, next to the commit tag.
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          v=$(grep -m1 -oP '(?<=<version>)[0-9]+\.[0-9]+\.[0-9]+(?=</version>)' service/docapi/pom.xml)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: BalinTomsk
          password: ${{ secrets.GHCR_PUSH_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: service/docapi
          file: service/docapi/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.vars.outputs.version }}

  deploy:
    needs: build-and-push
    # Deploy on a push to main, or on a manual run with deploy=true.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest   # change to your self-hosted VPC runner label if you close outside-DO SSH entirely
    steps:
      - name: Check deploy is configured
        id: guard
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "::notice::DEPLOY_HOST secret not set — image built & pushed, deploy skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to droplet
        if: steps.guard.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          TAG: ${{ needs.build-and-push.outputs.tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          proxy_host: ${{ secrets.DEPLOY_BASTION_HOST }}
          proxy_username: ${{ secrets.DEPLOY_BASTION_USER }}
          proxy_key: ${{ secrets.DEPLOY_BASTION_KEY }}
          envs: TAG
          # Same container as the manual deploy (efj-backend/secret/deploy-docapi-<v>.ps1, checked against the live one
          # 2026-11-16): localhost + the droplet's VPC address (eth1) so cproxy on the other droplet reaches it, the
          # docapi env file, the master key for the enc:v1 values, and the old container kept as docapi-prev. A failed
          # health check puts docapi-prev back.
          script: |
            set -e
            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u BalinTomsk --password-stdin
            docker pull "ghcr.io/balintomsk/docapi:${TAG}"
            docker logout ghcr.io || true
            if docker inspect docapi >/dev/null 2>&1; then
              docker rm -f docapi-prev >/dev/null 2>&1 || true
              docker stop -t 30 docapi
              docker rename docapi docapi-prev
              docker update --restart=no docapi-prev >/dev/null
            fi
            VPC=$(ip -4 -o addr show eth1 | awk '{print $4}' | cut -d/ -f1 | head -1)
            docker run -d --name docapi --restart unless-stopped \
              -p 127.0.0.1:8080:8080 ${VPC:+-p "$VPC:8080:8080"} \
              --env-file /mnt/volume_jnode/docapi/docapi.env \
              -e SPRING_PROFILES_ACTIVE=jdbc \
              -e FF_MASTER_KEY_FILE=/run/master.key \
              -v /mnt/volume_jnode/docapi/master.key:/run/master.key:ro \
              "ghcr.io/balintomsk/docapi:${TAG}"
            echo "Waiting for health..."
            for i in $(seq 1 30); do
              curl -sf http://localhost:8080/health && { echo; echo "docapi healthy"; exit 0; }
              sleep 3
            done
            echo "docapi did not become healthy in time; putting docapi-prev back" >&2
            docker logs --tail 50 docapi >&2 || true
            docker rm -f docapi
            if docker inspect docapi-prev >/dev/null 2>&1; then
              docker rename docapi-prev docapi && docker update --restart unless-stopped docapi && docker start docapi
            fi
            exit 1
