name: waterservice CI

# Gate every change to the water-station-pusher on a green test run before it can be
# packaged/deployed. Scoped to the service path so other monorepo services are unaffected.
on:
  push:
    paths:
      - "service/waterservice/**"
      - ".github/workflows/waterservice-ci.yml"
  pull_request:
    paths:
      - "service/waterservice/**"
      - ".github/workflows/waterservice-ci.yml"

defaults:
  run:
    working-directory: service/waterservice

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Verify the jar builds
        run: mvn -B -DskipTests package
